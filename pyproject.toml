[project]
name = "amazon-explorer"
version = "0.1.0"
description = "自然言語からAmazon商品候補を検索・正規化・ランキングするStreamlitアプリ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=46.0.0",
    "numpy>=2.0",
    "onnxruntime==1.23.2",
    "pillow>=12.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "scikit-learn>=1.7.2",
    "scipy>=1.15",
    "starlette>=1.1.0",
    "streamlit>=1.57.0",
    "sudachidict-core>=20260428",
    "sudachipy>=0.6.11",
]

[project.optional-dependencies]
lexical = [
    "ginza==5.2.1",
    "ja-ginza==5.2.0",
    "tokenizers==0.23.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "clip_runtime: uses the pinned repository-local CLIP model only with --run-clip-runtime",
    "live_api: permits intentional live-service access only with --run-live-api; excluded from CI",
    "bonsai_e2e: starts a localhost llama-server only with both live and Bonsai opt-ins",
    "bonsai_latency_diagnostic: selects the separately approved same-input Bonsai timing run",
    "cloudflare_e2e: calls Workers AI only with both live and Cloudflare opt-ins",
    "counterfactual_cloudflare_e2e: calls the minimum desired-plus-counterfactual Workers AI test",
    "product_image_proxy_e2e: calls one approved Amazon media image through the proxy and CLIP",
    "provisional_search_e2e: interactively gates Cloudflare references before product search",
    "backend_search_e2e: runs natural language, staged image approval, production job, and history",
]
pythonpath = ["."]
testpaths = ["tests"]
